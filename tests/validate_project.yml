---
- name: Validate repository security invariants
  hosts: localhost
  gather_facts: false
  vars:
    root: "{{ playbook_dir }}/.."
  tasks:
    - name: Read plaintext configuration
      ansible.builtin.set_fact:
        inventory: "{{ lookup('file', root ~ '/inventories/hosts.yml') }}"
        common_vars: "{{ lookup('file', root ~ '/inventories/group_vars/all/main.yml') }}"
        gitignore: "{{ lookup('file', root ~ '/.gitignore') }}"
        setup_playbook: "{{ lookup('file', root ~ '/playbooks/setup.yml') }}"
        llama_defaults: "{{ lookup('file', root ~ '/roles/llama_server/defaults/main.yml') }}"
        llama_compose: "{{ lookup('file', root ~ '/roles/llama_server/templates/compose.yml.j2') }}"
        vllm_defaults: "{{ lookup('file', root ~ '/roles/vllm_server/defaults/main.yml') }}"
        vllm_tasks: "{{ lookup('file', root ~ '/roles/vllm_server/tasks/main.yml') }}"
        vllm_prepare_artifact: "{{ lookup('file', root ~ '/roles/vllm_server/tasks/prepare_artifact.yml') }}"
        vllm_cleanup_cache: "{{ lookup('file', root ~ '/roles/vllm_server/tasks/cleanup_cache.yml') }}"
        qwen_profile: "{{ lookup('file', root ~ '/profiles/qwen-3.8-27b/manifest.yml') | from_yaml }}"
        qwen_compose: "{{ lookup('file', root ~ '/profiles/qwen-3.8-27b/compose.yml') }}"
        gemma_profile: "{{ lookup('file', root ~ '/profiles/gemma-4-31b/manifest.yml') | from_yaml }}"
        gemma_compose: "{{ lookup('file', root ~ '/profiles/gemma-4-31b/compose.yml') }}"
        gemma12_profile: "{{ lookup('file', root ~ '/profiles/gemma-4-12b/manifest.yml') | from_yaml }}"
        gemma12_compose: "{{ lookup('file', root ~ '/profiles/gemma-4-12b/compose.yml') }}"
        makefile: "{{ lookup('file', root ~ '/Makefile') }}"
        intel_defaults: "{{ lookup('file', root ~ '/roles/intel_gpu/defaults/main.yml') }}"
        intel_tasks: "{{ lookup('file', root ~ '/roles/intel_gpu/tasks/main.yml') }}"
        canary: "{{ lookup('file', root ~ '/roles/vllm_server/files/vllm_content_canary.sh') }}"
        hurl_playbook: "{{ lookup('file', root ~ '/playbooks/test_api.yml') }}"
        benchmark_playbook: "{{ lookup('file', root ~ '/playbooks/benchmark.yml') }}"
        benchmark_restore: "{{ lookup('file', root ~ '/playbooks/benchmark_restore.yml') }}"
        benchmark_restore_tasks: >-
          {{ lookup('file', root ~ '/playbooks/tasks/restore_vllm_benchmark.yml') }}
        benchmark_round_tasks: >-
          {{ lookup('file', root ~ '/playbooks/tasks/run_vllm_benchmark_round.yml') }}
        benchmark_precondition_tasks: >-
          {{ lookup('file', root ~ '/playbooks/tasks/precondition_vllm_benchmark_shape.yml') }}
        benchmark_suite: "{{ lookup('file', root ~ '/benchmarks/suite.yml') | from_yaml }}"
        qwen_xpu_dockerfile: "{{ lookup('file', root ~ '/containers/qwen38-xpu/Dockerfile') }}"
        gemma_xpu_dockerfile: "{{ lookup('file', root ~ '/containers/gemma4-xpu/Dockerfile') }}"

    - name: Read raw Vault ciphertext
      ansible.builtin.slurp:
        src: "{{ root }}/inventories/group_vars/all/vault.yml"
      register: vault_raw

    - name: Assert secret and connection conventions
      ansible.builtin.assert:
        that:
          - (vault_raw.content | b64decode).startswith('$ANSIBLE_VAULT;1.1;AES256')
          - "'.vault_pass' in gitignore"
          - "common_vars is search('ansible_private_key:.*vault_ssh_private_key')"
          - "'ansible_ssh_private_key_file' not in inventory"
          - "'ansible_password:' not in inventory"
          - "'vault_ubuntu_gpu_become_password' in inventory"
          - "'vault_llm_api_key' in common_vars"

    - name: Assert engine role separation and selection
      ansible.builtin.assert:
        that:
          - "'vllm_server_model:' not in common_vars"
          - "'llama_server_model_file:' not in common_vars"
          - "'llm_runtime_engine:' not in common_vars"
          - "'role: llama_server' in setup_playbook"
          - "\"when: llm_runtime_engine == 'llama_cpp'\" in setup_playbook"
          - "'role: vllm_server' in setup_playbook"
          - "\"when: llm_runtime_engine == 'vllm'\" in setup_playbook"
          - "'role: llm_runtime' in setup_playbook"
          - "'vllm_' not in (llama_defaults ~ llama_compose | lower)"
          - "'llama_model_' not in (vllm_defaults ~ vllm_tasks | lower)"
          - "'llama_backend' not in (vllm_defaults ~ vllm_tasks | lower)"
          - "'llm_runtime_llama_container_name' in llama_compose"

    - name: Calculate the Gemma runtime patch checksum
      ansible.builtin.stat:
        path: "{{ root }}/{{ gemma_profile.image.patch_file }}"
        checksum_algorithm: sha256
      register: gemma_runtime_patch

    - name: Calculate the Gemma 4 12B patch checksums
      ansible.builtin.stat:
        path: "{{ root }}/{{ item.value }}"
        checksum_algorithm: sha256
      loop: "{{ gemma12_patch_files | dict2items }}"
      vars:
        gemma12_patch_files:
          unified_mtp: "{{ gemma12_profile.image.unified_mtp_patch_file }}"
          flash_attn_descale: "{{ gemma12_profile.image.flash_attn_descale_patch_file }}"
          unified_mm: "{{ gemma12_profile.image.unified_mm_patch_file }}"
      register: gemma12_runtime_patches

    - name: Assert static model profile configuration
      ansible.builtin.assert:
        that:
          - qwen_profile.slug == 'qwen-3.8-27b'
          - qwen_profile.served_model_name == 'Qwen3.8-27B'
          - qwen_profile.image.expected_id == 'sha256:2b5d5a7346a801365234acb5eb53754fb0de73e194c7010076013ffa2391f0d7'
          - qwen_profile.model.revision == 'e28c5f952bdd5d814297a07d85a064a87af26a3f'
          - qwen_profile.model.files | length == 5
          - "'--max-model-len 131072' in qwen_compose"
          - "'--max-num-seqs 64' in qwen_compose"
          - "'--kv-cache-dtype fp8' in qwen_compose"
          - "'num_speculative_tokens\":4' in qwen_compose"
          - "'B70_DRAFT_LMHEAD_INT4' in qwen_compose"
          - "'B70_DRAFT_MTP_INT4' in qwen_compose"
          - gemma_profile.slug == 'gemma-4-31b'
          - gemma_profile.served_model_name == 'gemma-4-31B-it'
          - gemma_profile.image.expected_id == 'sha256:7343a52a92d943d5eb3199e6e5e9b74c4d76568556739a4b07b163963feb0297'
          - gemma_profile.image.patch_sha256 == 'a6f2ae363ebe0473192d21d40131408abe1b08b9f5f488e5c2c647ed553409b2'
          - gemma_runtime_patch.stat.checksum == gemma_profile.image.patch_sha256
          - gemma_profile.model.revision == '52f3f65bc7a02d555763bc923bd1d9094898219d'
          - gemma_profile.assistant.revision == '96d4c8ca3cb38c107a8478587878124895d1e844'
          - "'--max-model-len 32768' in gemma_compose"
          - "'--kv-cache-dtype fp8' in gemma_compose"
          - "'--tool-call-parser gemma4' in gemma_compose"
          - "'num_speculative_tokens\":4' in gemma_compose"
          - gemma12_profile.slug == 'gemma-4-12b'
          - gemma12_profile.served_model_name == 'gemma-4-12B-it'
          - gemma12_profile.image.expected_id == 'sha256:23e1bb365d25800039d5ae6e3acd707e7204ba2e0b87d18cd644306accfa6163'
          - gemma12_profile.model.revision == '707f0a3b8a3c7ad586ed01e27eafbad8a27dd0f7'
          - gemma12_profile.assistant.revision == '46d4c6f13f0ac0ad827b915669b8df9b81c64c51'
          - gemma12_runtime_patches.results[0].stat.checksum == gemma12_profile.image.unified_mtp_patch_sha256
          - gemma12_runtime_patches.results[1].stat.checksum == gemma12_profile.image.flash_attn_descale_patch_sha256
          - gemma12_runtime_patches.results[2].stat.checksum == gemma12_profile.image.unified_mm_patch_sha256
          - "'--max-model-len 131072' in gemma12_compose"
          - "'ONEAPI_DEVICE_SELECTOR: level_zero:0,1' in gemma12_compose"
          - "'--max-num-seqs 4' in gemma12_compose"
          - "'--data-parallel-size 2' in gemma12_compose"
          - "'--data-parallel-backend mp' in gemma12_compose"
          - "'--kv-cache-dtype auto' in gemma12_compose"
          - "'--quantization sym_int4' in gemma12_compose"
          - "'VLLM_INT4_GROUP_SIZE: \"32\"' in gemma12_compose"
          - "'num_speculative_tokens\":6' in gemma12_compose"
          - "gemma12_profile.assistant.revision in gemma12_compose"
          - "'\"image\":4,\"audio\":1,\"video\":1' in gemma12_compose"
          - "'--tool-call-parser gemma4' in gemma12_compose"
          - "qwen_xpu_dockerfile is search('FROM vllm/vllm-openai-xpu@sha256:f01e24f6')"
          - "qwen_xpu_dockerfile is search('ADD --checksum=sha256:4d7a02c4')"
          - "qwen_xpu_dockerfile is search('ADD --checksum=sha256:ffae4192')"
          - "qwen_xpu_dockerfile is search('ADD --checksum=sha256:4df179c3')"
          - "gemma_xpu_dockerfile is search('FROM intel/llm-scaler-vllm:0.21.0-b3.1@sha256:032916bd')"
          - "'llm-base-proposer-gemma4.patch' in gemma_xpu_dockerfile"

    - name: Validate all static Compose projects
      ansible.builtin.command:
        argv: [docker, compose, --project-name, vllm-server, --file, "{{ item }}", config, --quiet]
      loop:
        - "{{ root }}/profiles/qwen-3.8-27b/compose.yml"
        - "{{ root }}/profiles/gemma-4-31b/compose.yml"
        - "{{ root }}/profiles/gemma-4-12b/compose.yml"
      changed_when: false

    - name: Assert profile deployment and canary safeguards
      ansible.builtin.assert:
        that:
          - "'vllm_server_instances' not in vllm_tasks"
          - "'compose.yml.j2' not in vllm_tasks"
          - "'Load the selected profile manifest' in vllm_tasks"
          - "'Deploy the selected profile atomically' in vllm_tasks"
          - "'Restore the previous production Compose file' in vllm_tasks"
          - "'Download and verify selected model artifacts before downtime' in vllm_tasks"
          - "'sha256sum' in vllm_prepare_artifact"
          - "'vllm_server_cache_low_watermark_gib: 20' in vllm_defaults"
          - "'vllm_server_cache_target_gib: 30' in vllm_defaults"
          - "'check_mode: false' in vllm_tasks"
          - "'vllm_server_content_canary_failure_threshold: 2' in vllm_defaults"
          - "'vllm-gemma-candidate' in vllm_defaults"
          - "'Stop and disable retired content canary timers' in vllm_tasks"
          - "'Reload systemd after retiring content canaries' in vllm_tasks"
          - "'docker restart \"$container\"' in canary"
          - "'[ \"$failures\" -ge \"$failure_threshold\" ]' in canary"
          - "'MODEL is required' in makefile"
          - "'$(MAKE) verify' in makefile"
          - "'$(MAKE) ping' in makefile"
          - "'$(MAKE) check MODEL=$(MODEL)' in makefile"
          - >-
            'ghcr.io/orange-opensource/hurl:8.0.1@sha256:49a02dc39d7084e5a6e8c57e2d4754ef102e4ee3761a02ef6dc0e305ab1a832d'
            in hurl_playbook

    - name: Assert pinned Intel compute runtime
      ansible.builtin.assert:
        that:
          - "'intel_gpu_compute_runtime_version: 26.18.38308.1-0' in intel_defaults"
          - "intel_defaults.count('sha256:') == 6"
          - "'item.sha256' in intel_tasks"
          - "'intel_gpu_level_zero_version.stdout == intel_gpu_compute_runtime_version' in intel_tasks"

    - name: Check shell content canary syntax
      ansible.builtin.command:
        argv:
          - sh
          - -n
          - "{{ root }}/roles/vllm_server/files/vllm_content_canary.sh"
      changed_when: false

    - name: Check the retired scripts directory
      ansible.builtin.stat:
        path: "{{ root }}/scripts"
      register: retired_scripts_dir

    - name: Find retired Python tests
      ansible.builtin.find:
        paths: "{{ root }}/tests"
        patterns: "*.py"
        recurse: true
      register: retired_python

    - name: Assert custom benchmark and test Python projects are absent
      ansible.builtin.assert:
        that:
          - not retired_scripts_dir.stat.exists
          - retired_python.matched == 0

    - name: Find subjective or retired benchmark artifacts
      ansible.builtin.find:
        paths: "{{ root }}/benchmarks"
        patterns:
          - "*.md"
          - "profiles"
          - "results"
        file_type: any
        recurse: true
      register: retired_benchmark_artifacts

    - name: Assert canonical benchmark suite and lifecycle
      ansible.builtin.assert:
        that:
          - retired_benchmark_artifacts.matched == 0
          - benchmark_suite.schema_version == 1
          - benchmark_suite.seed == 0
          - benchmark_suite.rounds == 3
          - benchmark_suite.requests_per_concurrency == 5
          - benchmark_suite.preconditioning_requests_per_concurrency == 5
          - benchmark_suite.concurrency_levels == [1, 2, 4, 8]
          - benchmark_suite.output_tps_cv_limit_percent == 5.0
          - benchmark_suite.cases | map(attribute='id') | list == ['pp128-tg256', 'pp512-tg256', 'pp2048-tg128']
          - benchmark_suite.cases | map(attribute='dataset') | list == ['random', 'random', 'random']
          - "benchmark_round_tasks.count('      - vllm') == 1"
          - "benchmark_round_tasks.count('      - bench') == 1"
          - "benchmark_round_tasks.count('      - serve') == 1"
          - "'--save-detailed' in benchmark_round_tasks"
          - "'--num-warmups' in benchmark_round_tasks"
          - "benchmark_precondition_tasks.count('      - --num-warmups') == 1"
          - "'--disable-tqdm' in benchmark_precondition_tasks"
          - "'benchmark_require_clean_git: true' in benchmark_playbook"
          - "'benchmark_candidate_id: production' in benchmark_playbook"
          - "'benchmark_selected_cases' in benchmark_playbook"
          - "'selected_concurrency_levels' in benchmark_playbook"
          - "'selected_round_count' in benchmark_playbook"
          - "'127.0.0.1' in benchmark_playbook"
          - "'tasks/restore_vllm_benchmark.yml' in benchmark_playbook"
          - "'tasks/restore_vllm_benchmark.yml' in benchmark_restore"
          - "'vllm-content-canary-' in benchmark_restore_tasks"
          - "'benchmark_production_compose' in benchmark_restore_tasks"
          - "'benchmark_restored' in benchmark_restore_tasks"
          - "'/run/secrets/llm_api_key' in benchmark_round_tasks"
          - "'benchmark_invocations' in benchmark_playbook"
          - "'benchmark_public_argv' in benchmark_round_tasks"
          - "'benchmark_public_argv' in benchmark_precondition_tasks"
          - "\"map('regex_replace', '^.*; exec ', '')\" in benchmark_playbook"
          - "'Config.Env' not in benchmark_playbook"

    - name: Exercise the objective jq aggregation
      ansible.builtin.command:
        argv:
          - jq
          - --slurp
          - --arg
          - run_id
          - fixture
          - --arg
          - suite_sha256
          - fixture-sha
          - --argjson
          - cv_limit
          - "5"
          - --argjson
          - metric_names
          - '["output_throughput"]'
          - --from-file
          - "{{ root }}/benchmarks/aggregate.jq"
      args:
        stdin: |-
          {"case_id":"fixture","input_len":"128","output_len":"256","max_concurrency":1,"round":"1","result_file":"r1.json","completed":5,"failed":0,"output_throughput":100}
          {"case_id":"fixture","input_len":"128","output_len":"256","max_concurrency":1,"round":"2","result_file":"r2.json","completed":5,"failed":0,"output_throughput":101}
          {"case_id":"fixture","input_len":"128","output_len":"256","max_concurrency":1,"round":"3","result_file":"r3.json","completed":5,"failed":0,"output_throughput":99}
      register: benchmark_aggregate_fixture
      changed_when: false

    - name: Assert objective aggregation output
      ansible.builtin.assert:
        that:
          - (benchmark_aggregate_fixture.stdout | from_json).passed | bool
          - (benchmark_aggregate_fixture.stdout | from_json).cases[0].metrics.output_throughput.mean == 100
          - (benchmark_aggregate_fixture.stdout | from_json).cases[0].metrics.output_throughput.median == 100
