---
- name: Test the live OpenAI-compatible API with Hurl
  hosts: ubuntu
  gather_facts: false
  vars:
    llm_role_defaults: >-
      {{ lookup('file', playbook_dir ~ '/../roles/llm_runtime/defaults/main.yml') | from_yaml }}
    vllm_role_defaults: >-
      {{ lookup('file', playbook_dir ~ '/../roles/vllm_server/defaults/main.yml') | from_yaml }}
    api_test_bind_address: >-
      {{ llm_runtime_bind_address | default(llm_role_defaults.llm_runtime_bind_address) }}
    api_test_port: "{{ llm_runtime_port | default(llm_role_defaults.llm_runtime_port) }}"
    api_test_model: >-
      {{ vllm_server_served_model_name | default(vllm_role_defaults.vllm_server_served_model_name) }}
    hurl_image: >-
      ghcr.io/orange-opensource/hurl:8.0.1@sha256:49a02dc39d7084e5a6e8c57e2d4754ef102e4ee3761a02ef6dc0e305ab1a832d
    api_test_dir: "{{ playbook_dir }}/../tests/api"
    api_test_jobs: 1
  tasks:
    - name: Run Hurl tests with temporary credentials
      block:
        - name: Create local Hurl variable directory
          ansible.builtin.tempfile:
            state: directory
            prefix: ubuntu-b70-hurl-
          register: hurl_variables_dir
          delegate_to: localhost

        - name: Write secret Hurl variables
          ansible.builtin.copy:
            content: |
              api_origin=http://{{ api_test_bind_address }}:{{ api_test_port }}
              api_key={{ llm_api_key }}
              model={{ api_test_model }}
            dest: "{{ hurl_variables_dir.path }}/variables"
            mode: "0600"
          delegate_to: localhost
          no_log: true

        - name: Run declarative API and tool-calling tests
          ansible.builtin.command:
            argv:
              - docker
              - run
              - --rm
              - --network
              - host
              - --volume
              - "{{ api_test_dir }}:/tests:ro"
              - --volume
              - "{{ hurl_variables_dir.path }}/variables:/run/secrets/hurl-variables:ro"
              - "{{ hurl_image }}"
              - --test
              - --jobs
              - "{{ api_test_jobs | string }}"
              - --variables-file
              - /run/secrets/hurl-variables
              - /tests/health.hurl
              - /tests/models.hurl
              - /tests/chat.hurl
              - /tests/tool-calling.hurl
              - /tests/tool-calling-stream.hurl
          delegate_to: localhost
          changed_when: false
          register: hurl_result

        - name: Show Hurl test summary
          ansible.builtin.debug:
            var: hurl_result.stderr_lines
      always:
        - name: Remove local Hurl variables
          ansible.builtin.file:
            path: "{{ hurl_variables_dir.path }}"
            state: absent
          when: hurl_variables_dir is defined
          delegate_to: localhost
          no_log: true
