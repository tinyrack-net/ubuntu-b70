---
- name: Precondition the selected workload and concurrency shape
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ benchmark_container_name }}"
      - bash
      - -lc
      - >-
        export OPENAI_API_KEY="$(cat /run/secrets/llm_api_key)";
        exec vllm bench serve
        --backend openai-chat
        --base-url http://127.0.0.1:8080
        --endpoint /v1/chat/completions
        --model {{ benchmark_model | quote }}
        --tokenizer {{ benchmark_tokenizer | quote }}
        --dataset-name random
        --random-input-len {{ benchmark_shape.0.input_len | int }}
        --random-output-len {{ benchmark_shape.0.output_len | int }}
        --random-range-ratio 0
        --num-prompts {{
          (benchmark_shape.1 | int)
          * (benchmark_suite.preconditioning_requests_per_concurrency | int)
        }}
        --num-warmups 0
        --max-concurrency {{ benchmark_shape.1 | int }}
        --request-rate {{ benchmark_suite.request_rate | quote }}
        --seed {{ benchmark_suite.seed | int }}
        --ignore-eos
        --temperature {{ benchmark_suite.temperature | int }}
        --disable-tqdm
  changed_when: false
  become: true
