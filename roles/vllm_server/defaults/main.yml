---
vllm_server_install_dir: /opt/vllm-server
vllm_server_api_key_path: /etc/vllm-server/api-key
vllm_server_data_dir: /var/lib/vllm-server
vllm_server_hf_cache_dir: "{{ vllm_server_data_dir }}/huggingface"
vllm_server_legacy_hf_cache_dir: /var/lib/llama-server/huggingface

vllm_server_image: ubuntu-b70/qwen38-xpu:7025ef4
vllm_server_model: SergiioB/Qwen3.8-27B-GPTQ-Int4-sym-G128-MTP-BF16
vllm_server_model_revision: e28c5f952bdd5d814297a07d85a064a87af26a3f
vllm_server_model_files:
  - name: model-00001-of-00005.safetensors
    sha256: 30c8e2b1c82cdcc840848b5c98bafe2f74269b1e6472a053ce7d7b2d002f39a7
  - name: model-00002-of-00005.safetensors
    sha256: ff66eaf6ecc6e4b214f281ac532dcfcb07c60d5a8c78cf145bc93c38c00c024e
  - name: model-00003-of-00005.safetensors
    sha256: 15284cb88d52ea1648b4fcc68901286d7c4795388e05ae1e143c8026fcb0be44
  - name: model-00004-of-00005.safetensors
    sha256: 878ae6ebc9553de5340df0d6097aa319f58650382c89e474b39d0c0a98e76932
  - name: model-00005-of-00005.safetensors
    sha256: 2a6ebd04c77c2d5ce5952ca81a4197f1c34f712a00c293a25242ec27ac413729
vllm_server_tokenizer: SergiioB/Qwen3.8-27B-GPTQ-Int4-sym-G128-MTP-BF16
vllm_server_tokenizer_revision: e28c5f952bdd5d814297a07d85a064a87af26a3f
vllm_server_quantization: gptq
vllm_server_served_model_name: Qwen3.8-27B
vllm_server_language_model_only: true
vllm_server_limit_mm_per_prompt:
  image: 1
  video: 0
vllm_server_mm_processor_kwargs:
  max_pixels: 1048576
  min_pixels: 65536
vllm_server_mm_processor_cache_type: shm
vllm_server_mm_processor_cache_gb: "1"
vllm_server_context_size: 131072
vllm_server_max_num_seqs: 64
vllm_server_max_num_batched_tokens: 8192
vllm_server_num_speculative_tokens: 4
vllm_server_data_parallel_size: 1
vllm_server_gpu_memory_utilization: "0.88"
vllm_server_kv_cache_dtype: fp8
vllm_server_enable_xpu_graph: true
vllm_server_enable_prefix_caching: false
vllm_server_enforce_eager: false
vllm_server_compilation_config: ""
vllm_server_mamba_cache_dtype: auto
vllm_server_mamba_ssm_cache_dtype: auto
vllm_server_enable_auto_tool_choice: true
vllm_server_tool_call_parser: qwen3_xml
vllm_server_reasoning_parser: qwen3
vllm_server_content_canary_enabled: true
vllm_server_content_canary_interval: 5min
vllm_server_content_canary_failure_threshold: 2
vllm_server_content_canary_marker: B70_CANARY_OK
vllm_server_retired_content_canary_instances:
  - vllm-server-1
vllm_server_instances:
  - name: "{{ llm_runtime_vllm_container_name }}"
    port: "{{ llm_runtime_port }}"
    image: ubuntu-b70/qwen38-xpu:7025ef4
    expected_image_id: sha256:2b5d5a7346a801365234acb5eb53754fb0de73e194c7010076013ffa2391f0d7
    device_selector: level_zero:0
    tensor_parallel_size: 1
    data_parallel_size: 1
    max_num_seqs: 64
    extra_environment:
      VLLM_WORKER_MULTIPROC_METHOD: spawn
      B70_MTP_BF16_DRAFT: "1"
      B70_DRAFT_LMHEAD_INT4: "1"
      B70_DRAFT_MTP_INT4: "1"
    speculative_config:
      method: mtp
      num_speculative_tokens: "{{ vllm_server_num_speculative_tokens | int }}"
