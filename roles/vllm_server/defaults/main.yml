---
vllm_server_install_dir: /opt/vllm-server
vllm_server_api_key_path: /etc/vllm-server/api-key
vllm_server_data_dir: /var/lib/vllm-server
vllm_server_hf_cache_dir: "{{ vllm_server_data_dir }}/huggingface"
vllm_server_legacy_hf_cache_dir: /var/lib/llama-server/huggingface

vllm_server_image: >-
  intel/llm-scaler-vllm:0.21.0-b3.1@sha256:032916bd9264da44cab3e99092ffaf12331072ec51c3b380cbbe5fd98eb0254b
vllm_server_model: RedHatAI/Qwen3.8-27B-INT4
vllm_server_model_revision: 2fb0debc365fb6c1683d7d3ad7722470919627a8
vllm_server_model_files:
  - name: model.safetensors
    sha256: f078f51aed0c1dba613c1759487004ee06aba1a290606b6be125f59ab710959e
  - name: model_mtp.safetensors
    sha256: 1d8268aa85ace093a561e3e7b63b9d390dac1cd55a90cd55b5ec509c3c9da9fe
vllm_server_tokenizer: Qwen/Qwen3.8-27B
vllm_server_tokenizer_revision: 1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0
vllm_server_quantization: compressed-tensors
vllm_server_served_model_name: Qwen3.8-27B
vllm_server_context_size: 32768
vllm_server_max_num_seqs: 4
vllm_server_max_num_batched_tokens: 2048
vllm_server_data_parallel_size: 1
vllm_server_gpu_memory_utilization: "0.92"
vllm_server_kv_cache_dtype: auto
vllm_server_enable_xpu_graph: true
vllm_server_enable_prefix_caching: false
vllm_server_enable_auto_tool_choice: true
vllm_server_tool_call_parser: qwen3_xml
vllm_server_reasoning_parser: qwen3
vllm_server_content_canary_enabled: true
vllm_server_content_canary_interval: 5min
vllm_server_content_canary_failure_threshold: 2
vllm_server_content_canary_marker: B70_CANARY_OK
vllm_server_retired_content_canary_instances:
  - vllm-server-1
vllm_server_instances:
  - name: "{{ llm_runtime_vllm_container_name }}"
    port: "{{ llm_runtime_port }}"
    device_selector: level_zero:0,1
    tensor_parallel_size: 1
    data_parallel_size: 2
    max_num_seqs: 4
    extra_environment:
      VLLM_WORKER_MULTIPROC_METHOD: spawn
    speculative_config: {method: qwen3_5_mtp, num_speculative_tokens: 3}
