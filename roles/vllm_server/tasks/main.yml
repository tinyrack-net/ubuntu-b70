---
- name: Check vLLM install directory
  ansible.builtin.stat:
    path: "{{ vllm_server_install_dir }}"
  register: vllm_server_install

- name: Create vLLM base directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ vllm_server_install_dir }}", mode: "0755"}
    - {path: "{{ vllm_server_api_key_path | dirname }}", mode: "0700"}
    - {path: "{{ vllm_server_data_dir }}", mode: "0755"}
  become: true

- name: Check legacy vLLM cache
  ansible.builtin.stat:
    path: "{{ vllm_server_legacy_hf_cache_dir }}"
  register: vllm_server_legacy_cache

- name: Check vLLM cache destination
  ansible.builtin.stat:
    path: "{{ vllm_server_hf_cache_dir }}"
  register: vllm_server_cache

- name: Move legacy vLLM cache into the vLLM data directory
  ansible.builtin.command:
    argv:
      - mv
      - "{{ vllm_server_legacy_hf_cache_dir }}"
      - "{{ vllm_server_hf_cache_dir }}"
  when:
    - vllm_server_legacy_cache.stat.exists
    - not vllm_server_cache.stat.exists
  become: true

- name: Create vLLM server directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ vllm_server_hf_cache_dir }}", mode: "0755"}
  become: true

- name: Install vLLM API key file
  ansible.builtin.copy:
    content: "{{ llm_api_key }}\n"
    dest: "{{ vllm_server_api_key_path }}"
    owner: root
    group: root
    mode: "0600"
  become: true
  no_log: true
  notify: Restart vllm-server

- name: Render vLLM Compose project
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ vllm_server_install_dir }}/compose.yml"
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Inspect pinned local vLLM images
  ansible.builtin.command:
    argv:
      - docker
      - image
      - inspect
      - --format={{ '{{' }}.Id{{ '}}' }}
      - "{{ item.image }}"
  register: vllm_server_local_image
  changed_when: false
  check_mode: false
  become: true
  loop: "{{ vllm_server_instances }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.expected_image_id is defined

- name: Verify pinned local vLLM image IDs
  ansible.builtin.assert:
    that:
      - item.stdout == item.item.expected_image_id
    fail_msg: >-
      Refusing to start {{ item.item.name }}: local image ID {{ item.stdout | default('missing') }}
      does not match {{ item.item.expected_image_id }}.
  loop: "{{ vllm_server_local_image.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name | default('unknown') }}"
  when: item.item.expected_image_id is defined

- name: Start vLLM Compose project
  community.docker.docker_compose_v2:
    project_src: "{{ vllm_server_install_dir }}"
    pull: missing
    state: present
    wait: false
    remove_orphans: true
  become: true
  when: not ansible_check_mode or vllm_server_install.stat.exists

- name: Apply pending vLLM restart
  ansible.builtin.meta: flush_handlers

- name: Wait for vLLM health endpoint
  ansible.builtin.uri:
    url: "http://{{ llm_runtime_bind_address }}:{{ item.port }}/health"
    status_code:
      - 200
      - 503
    return_content: true
    headers:
      Authorization: "Bearer {{ llm_api_key }}"
  register: vllm_server_health
  until: vllm_server_health.status == 200
  retries: 180
  delay: 10
  no_log: true
  loop: "{{ vllm_server_instances }}"

- name: Verify authenticated vLLM model endpoint
  ansible.builtin.uri:
    url: "http://{{ llm_runtime_bind_address }}:{{ item.port }}/v1/models"
    headers:
      Authorization: "Bearer {{ llm_api_key }}"
    status_code: 200
  no_log: true
  loop: "{{ vllm_server_instances }}"

- name: Verify pinned vLLM model files
  ansible.builtin.include_tasks: verify_model.yml
  loop: "{{ vllm_server_instances }}"
  loop_control:
    loop_var: model_instance
    label: "{{ model_instance.name }}"

- name: Install vLLM content canary
  ansible.builtin.copy:
    src: vllm_content_canary.sh
    dest: /usr/local/libexec/vllm-content-canary
    owner: root
    group: root
    mode: "0755"
  become: true
  when: vllm_server_content_canary_enabled | bool

- name: Install vLLM content canary service
  ansible.builtin.template:
    src: vllm-content-canary.service.j2
    dest: "/etc/systemd/system/vllm-content-canary-{{ canary_instance.name }}.service"
    owner: root
    group: root
    mode: "0644"
  become: true
  when: vllm_server_content_canary_enabled | bool
  loop: "{{ vllm_server_instances }}"
  loop_control:
    loop_var: canary_instance
    label: "{{ canary_instance.name }}"

- name: Install vLLM content canary timer
  ansible.builtin.template:
    src: vllm-content-canary.timer.j2
    dest: "/etc/systemd/system/vllm-content-canary-{{ canary_instance.name }}.timer"
    owner: root
    group: root
    mode: "0644"
  become: true
  when: vllm_server_content_canary_enabled | bool
  loop: "{{ vllm_server_instances }}"
  loop_control:
    loop_var: canary_instance
    label: "{{ canary_instance.name }}"

- name: Enable vLLM content canary timer
  ansible.builtin.systemd_service:
    name: "vllm-content-canary-{{ canary_instance.name }}.timer"
    enabled: true
    state: started
    daemon_reload: true
  become: true
  when:
    - vllm_server_content_canary_enabled | bool
    - not ansible_check_mode
  loop: "{{ vllm_server_instances }}"
  loop_control:
    loop_var: canary_instance
    label: "{{ canary_instance.name }}"

- name: Disable legacy single-instance vLLM content canary timer
  ansible.builtin.systemd_service:
    name: vllm-content-canary.timer
    enabled: false
    state: stopped
  become: true
  failed_when: false
  when: not ansible_check_mode

- name: Remove legacy single-instance vLLM content canary units
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item }}"
    state: absent
  loop:
    - vllm-content-canary.service
    - vllm-content-canary.timer
  become: true

- name: Disable retired per-instance vLLM content canary timers
  ansible.builtin.systemd_service:
    name: "vllm-content-canary-{{ item }}.timer"
    enabled: false
    state: stopped
  loop: "{{ vllm_server_retired_content_canary_instances }}"
  become: true
  failed_when: false
  when: not ansible_check_mode

- name: Remove retired per-instance vLLM content canary units
  ansible.builtin.file:
    path: "/etc/systemd/system/vllm-content-canary-{{ item.0 }}.{{ item.1 }}"
    state: absent
  loop: "{{ vllm_server_retired_content_canary_instances | product(['service', 'timer']) | list }}"
  become: true
