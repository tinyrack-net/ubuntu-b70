---
- name: Calculate pinned model file checksums
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ model_instance.name }}"
      - sha256sum
      - >-
        /root/.cache/huggingface/hub/models--{{ (model_instance.model |
        default(vllm_server_model)) | replace('/', '--') }}/snapshots/{{
        model_instance.model_revision | default(vllm_server_model_revision) }}/{{ model_file.name }}
  loop: "{{ model_instance.model_files | default(vllm_server_model_files) }}"
  loop_control:
    loop_var: model_file
    label: "{{ model_file.name }}"
  register: vllm_server_model_checksum_results
  changed_when: false
  become: true

- name: Assert pinned model file checksums
  ansible.builtin.assert:
    that:
      - item.stdout.split()[0] == item.model_file.sha256
    fail_msg: "Pinned checksum mismatch for {{ item.model_file.name }} in {{ model_instance.name }}"
  loop: "{{ vllm_server_model_checksum_results.results }}"
  loop_control:
    label: "{{ item.model_file.name }}"
  when: not (item.skipped | default(false))
