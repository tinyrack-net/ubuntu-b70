---
- name: Assert supported LLM engine
  ansible.builtin.assert:
    that:
      - llm_engine in ['llama_cpp', 'vllm']
    fail_msg: "Unsupported llm_engine: {{ llm_engine }}"

- name: Stop the inactive LLM engine container
  community.docker.docker_container:
    name: "{{ vllm_container_name if llm_engine == 'llama_cpp' else llama_container_name }}"
    state: absent
  become: true
