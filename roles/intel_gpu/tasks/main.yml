---
- name: Create Intel compute runtime package cache
  ansible.builtin.file:
    path: /var/cache/intel-compute-runtime
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Check Intel compute runtime package cache
  ansible.builtin.stat:
    path: /var/cache/intel-compute-runtime
  register: intel_gpu_runtime_cache

- name: Download pinned Intel compute runtime packages
  ansible.builtin.get_url:
    url: >-
      {{ item.url | default('https://github.com/intel/compute-runtime/releases/download/' ~
      intel_gpu_compute_runtime_release ~ '/' ~ item.name) }}
    dest: "/var/cache/intel-compute-runtime/{{ item.name }}"
    checksum: "sha256:{{ item.sha256 }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ intel_gpu_compute_runtime_packages }}"
  become: true
  when: not ansible_check_mode or intel_gpu_runtime_cache.stat.exists

- name: Install pinned Intel compute runtime packages
  ansible.builtin.apt:
    deb: "/var/cache/intel-compute-runtime/{{ item.name }}"
    state: present
  loop: "{{ intel_gpu_compute_runtime_packages }}"
  become: true
  when: not ansible_check_mode

- name: Install Intel GPU compute runtimes and diagnostics
  ansible.builtin.apt:
    name:
      - clinfo
      - intel-gpu-tools
      - intel-opencl-icd
      - libze-intel-gpu1
      - mesa-vulkan-drivers
      - vulkan-tools
    state: present
  become: true

- name: Read installed Intel Level Zero runtime version
  ansible.builtin.command:
    argv:
      - dpkg-query
      - -W
      - "-f=${Version}"
      - libze-intel-gpu1
  register: intel_gpu_level_zero_version
  changed_when: false
  check_mode: false

- name: Assert pinned Intel Level Zero runtime is installed
  ansible.builtin.assert:
    that:
      - intel_gpu_level_zero_version.stdout == intel_gpu_compute_runtime_version
    fail_msg: Intel Level Zero runtime does not match the repository-pinned version.
  when: not ansible_check_mode

- name: Add managed user to GPU groups
  ansible.builtin.user:
    name: "{{ ansible_facts['user_id'] }}"
    groups:
      - render
      - video
    append: true
  become: true

- name: Read display controllers
  ansible.builtin.command: lspci -nnk
  register: intel_gpu_lspci
  changed_when: false
  check_mode: false

- name: Check Intel GPU device nodes
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ intel_gpu_card_device }}"
    - "{{ intel_gpu_render_device }}"
  register: intel_gpu_nodes

- name: Assert B70 and xe driver are available
  ansible.builtin.assert:
    that:
      - intel_gpu_pci_id in (intel_gpu_lspci.stdout | lower)
      - "'Kernel driver in use: xe' in intel_gpu_lspci.stdout"
      - intel_gpu_nodes.results | map(attribute='stat.exists') | min
    fail_msg: Intel B70, xe kernel driver, or required /dev/dri nodes are missing.
