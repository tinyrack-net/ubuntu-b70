---
services:
  vllm-server:
    image: ubuntu-b70/qwen38-xpu:7025ef4
    pull_policy: never
    container_name: vllm-server
    restart: unless-stopped
    ports:
      - "10.132.247.37:8080:8080"
    devices:
      - "/dev/dri:/dev/dri"
    ipc: host
    privileged: true
    environment:
      ONEAPI_DEVICE_SELECTOR: level_zero:0
      VLLM_XPU_ENABLE_XPU_GRAPH: "1"
      VLLM_WORKER_MULTIPROC_METHOD: spawn
      B70_MTP_BF16_DRAFT: "1"
      B70_DRAFT_LMHEAD_INT4: "1"
      B70_DRAFT_MTP_INT4: "1"
    volumes:
      - "/etc/vllm-server/api-key:/run/secrets/llm_api_key:ro"
      - "/var/lib/vllm-server/huggingface:/root/.cache/huggingface"
      - "/dev/dri/by-path:/dev/dri/by-path:ro"
    entrypoint: [/bin/bash, -lc]
    command:
      - >-
        export VLLM_API_KEY="$$(cat /run/secrets/llm_api_key)";
        exec vllm serve "SergiioB/Qwen3.8-27B-GPTQ-Int4-sym-G128-MTP-BF16"
        --revision "e28c5f952bdd5d814297a07d85a064a87af26a3f"
        --tokenizer "SergiioB/Qwen3.8-27B-GPTQ-Int4-sym-G128-MTP-BF16"
        --tokenizer-revision "e28c5f952bdd5d814297a07d85a064a87af26a3f"
        --served-model-name "Qwen3.8-27B"
        --language-model-only
        --host 0.0.0.0 --port 8080
        --dtype float16
        --quantization gptq
        --max-model-len 131072
        --max-num-seqs 64
        --max-num-batched-tokens 8192
        --gpu-memory-utilization 0.88
        --no-enable-prefix-caching
        --kv-cache-dtype fp8
        --speculative-config '{"method":"mtp","num_speculative_tokens":4}'
        --enable-auto-tool-choice
        --tool-call-parser qwen3_xml
        --reasoning-parser qwen3
        --generation-config vllm
