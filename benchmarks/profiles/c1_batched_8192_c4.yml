---
vllm_benchmark_profile: c1_batched_8192_c4
vllm_server_instances:
  - name: vllm-server
    port: 8080
    device_selector: level_zero:0
    tensor_parallel_size: 1
    max_num_seqs: 4
  - name: vllm-candidate
    port: 8081
    device_selector: level_zero:1
    tensor_parallel_size: 1
    max_num_seqs: 4
    max_num_batched_tokens: 8192
    enable_prefix_caching: true
    enable_xpu_graph: true
