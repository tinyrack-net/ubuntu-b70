---
vllm_benchmark_profile: dp2_intel_mtp3_68k_gdn_hardened
vllm_benchmark_concurrency_levels: [1, 2, 4, 8]
vllm_server_context_size: 69632
vllm_server_kv_cache_dtype: auto
vllm_server_instances:
  - name: vllm-server
    image: ubuntu-b70/vllm-gdn-hardened:0.21.0-b3.1
    expected_image_id: >-
      sha256:e12217bc7ccaca465eaa42d5a7005ed7bb4daab3328aa75c9d290ae2a17e9394
    port: 8080
    device_selector: level_zero:0,1
    tensor_parallel_size: 1
    data_parallel_size: 2
    context_size: 69632
    max_num_seqs: 4
    max_num_batched_tokens: 2048
    kv_cache_dtype: auto
    enable_xpu_graph: true
    enable_prefix_caching: false
    mamba_ssm_cache_dtype: float32
    extra_environment:
      VLLM_WORKER_MULTIPROC_METHOD: spawn
    speculative_config: {method: qwen3_5_mtp, num_speculative_tokens: 3}
